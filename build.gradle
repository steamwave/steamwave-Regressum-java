plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
    id 'com.gradleup.shadow' version '9.0.2'
}

apply plugin: 'java'
apply plugin: 'com.gradleup.shadow'

version = mod_version
group = mod_group_id

// В NeoGradle 7 (userdev) для работы миксинов достаточно
// просто указать их в блоке minecraft или через зависимости
minecraft {
    // Если этот блок вызывает ошибку, его можно просто удалить.
    // NeoGradle 7.0.192 обычно сам ищет миксины в ресурсах.
   // accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        // Эти параметры КРИТИЧЕСКИ важны для генерации рефмапа во время запуска
        systemProperty 'mixin.env.remapRefMap', 'true'
        systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Твои библиотеки
    compileOnly files('libs/create-1.21.1-6.0.7.jar')
    compileOnly files('libs/ponder-neoforge-1.0.82+mc1.21.1.jar')

    implementation 'com.zaxxer:HikariCP:6.2.0'
    shadow 'com.zaxxer:HikariCP:6.2.0'
    shadow 'com.j256.ormlite:ormlite-jdbc:5.1'
    shadow 'org.slf4j:slf4j-api:2.0.16'
    shadow 'org.postgresql:postgresql:42.7.4'
    shadow 'ch.qos.logback:logback-classic:1.5.8'

    implementation "net.neoforged:neoforge:${neo_version}"

    // ДОБАВЬ ЭТО: Аннотационный процессор для Mixin, чтобы ошибки "Unable to locate..." пропали
    // annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Удаляем старые попытки добавить рефмап через compilerArgs,
// так как они не работали корректно без маппингов.

shadowJar {

    configurations = [project.configurations.shadow]

    archiveClassifier = '' // Итоговый JAR не будет иметь суффикса (например, -all)

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    mergeServiceFiles() // Объединяет файлы сервисов (например, SLF4J)

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'

    exclude 'about.html', 'about_files/**'

    exclude 'META-INF/maven/**'

    exclude 'org/apache/logging/log4j/**' // Исключаем log4j

    exclude 'org/checkerframework/**' // Исключаем checker-qual



// Перемещение зависимостей в уникальный пакет для избежания конфликтов

    relocate 'com.zaxxer.hikari', 'ru.steamwave.regressum.lib.com.zaxxer.hikari'

    relocate 'org.slf4j', 'ru.steamwave.regressum.lib.org.slf4j'

    relocate 'org.postgresql', 'ru.steamwave.regressum.lib.org.postgresql'

    relocate 'com.j256.ormlite', 'ru.steamwave.regressum.lib.com.j256.ormlite'

    relocate 'org.apache.commons', 'ru.steamwave.regressum.lib.org.apache.commons'



    manifest {

        attributes([

                'Specification-Title': 'regressum',

                'Specification-Vendor': 'Steamwave',

                'Specification-Version': '1',

                'Implementation-Title': project.name,

                'Implementation-Version': project.version,

                'Implementation-Vendor': 'Steamwave'

        ])

    }


}
tasks.named('build') {
    dependsOn shadowJar
}